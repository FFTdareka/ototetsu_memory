<!DOCTYPE html>
<html>
    <head>
        <title>ニュース編集 - みんなの音鉄記録帳</title>
        <meta charset="UTF-8">
        <meta name="description" content="「みんなの音鉄記録帳」は、日本全国の発車メロディーが流れる駅の鳴動記録を、皆様の投稿によって記録するサイトです。コーラス数が固定でない限り、放送被り、乗降促進問わず、どの駅のどの記録も記録ができます。" />
        <meta property="og:title" content="ニュース編集 - みんなの音鉄記録帳">
        <meta property="og:description" content="「みんなの音鉄記録帳」は、日本全国の発車メロディーが流れる駅の鳴動記録を、皆様の情報提供によって記録するサイトです。コーラス数が固定でない限り、放送被り、乗降促進問わず、どの駅のどの記録も記録ができます。">
        <meta property="og:url" content="https://fftdareka.github.io/ototetsu_memory/member/editNews.html">
        <meta property="og:image" content="https://fftdareka.github.io/ototetsu_memory/img/favicon.ico">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="みんなの音鉄記録帳">
        <link rel="icon" href="../img/favicon.ico">
        <link rel="apple-touch-icon-precomposed" href="../img/favicon.ico">
        <link rel="stylesheet" href="../css/normal.css">
        <script src="../data/func.js"></script>
        <script>
            window.onload = () => {
                let ifr = document.getElementsByTagName("iframe");
                for (var i = 0; i < ifr.length; i++) {
                    try {
                        let contentHeight = ifr[i].contentWindow.document.body.scrollHeight;
                        ifr[i].style.height = contentHeight + 'px';
                    } catch (e) {
                    }
                }
            };
        </script>
    </head>
    <body>
        <h1><span onclick="location.href = 'https:\/\/fftdareka.github.io\/ototetsu_memory\/';">みんなの音鉄記録帳</span> ニュース編集</h1>
        <div id="user"><span id="status"><span id="userName"></span><span id="userStatus">読込中...</span></span><span id="login">読込中...</span> </div>
        <div>ユーザー設定は<a href="user.html">こちら</a></div>
        <br>
        <iframe src="../jre_press.html" width="100%" scrolling="no" frameborder="0" style="border: none"></iframe>
        <br>
        <h2>ニュース作成・編集・削除</h2>
        <div id="newsStatus"></div>
        <div id="newsMsg" style="display:none;"></div>
        <div id="newsSpace">
            <label>
                タイトル
                <input id="addNews_title" type="text" placeholder="タイトルを入力...">
            </label>
            <br>
            <label>
                本文
                <textarea id="addNews_body" placeholder="本文を入力..."></textarea>
            </label>
            <br>
            <label>
                掲載順位
                <input id="addNews_rank" type="number" placeholder="掲載順位を自然数で入力...">
            </label>
            <br>
            <label>
                確認
                <input id="addNews_chk" type="checkbox"><span>入力内容を確認し、正常なニュース入力を行いました。</span>
            </label>
            <br>
            <button id="addNews_btn" type="button" disabled>送信</button>
            <button id="deleteNews_btn" type="button" class="redB" style="display:none;">削除</button>
        </div>
        <br>
        <div>
            <a href="https://fftdareka.github.io/ototetsu_memory/member/news.html">前画面へ戻る</a>
            <br>
            <a href="https://fftdareka.github.io/ototetsu_memory/">トップページへ</a>
        </div>
        <script type="module" src="../data/firebase.js"></script>
        <script type="module" src="../data/mhome.js"></script>
        <script type="module" src="../data/editnews.js"></script>
    </body>
</html>
